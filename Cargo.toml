[package]
name = "prunecode"
version = "0.1.0"
edition = "2021"
description = "Detect structural and semantic anti-patterns in codebases"
license = "MIT"
repository = "https://github.com/dlabadini/prune"
keywords = ["linter", "code-analysis", "refactoring", "ai", "developer-tools"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
# CLI & TUI
clap = { version = "4.4", features = ["derive", "env"] }
ratatui = "0.28"
crossterm = "0.28"
arboard = "3.4"

# Parsing and structural search (tree-sitter comes in via ast-grep)

# Storage
rusqlite = { version = "0.32", features = ["bundled", "load_extension"] }

# Async & File Watching
tokio = { version = "1.40", features = ["full"] }
notify = "7.0"
notify-debouncer-mini = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Utilities
walkdir = "2.5"
glob = "0.3"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ignore = "0.4"
similar = "2.6"
dirs = "5.0"
fastembed = "7.0.1"
rmcp = { version = "3.4.0", features = ["server", "transport-io"] }
schemars = { version = "1.2.2", features = ["derive"] }
oxc_allocator = "0.151.0"
oxc_parser = "0.151.0"
oxc_semantic = "0.151.0"
oxc_ast = "0.151.0"
oxc_span = "0.151.0"
oxc_resolver = "11.24.3"
ast-grep-core = "0.45.3"
ast-grep-language = { version = "0.45.3", default-features = false, features = ["tree-sitter-typescript", "tree-sitter-javascript"] }
petgraph = "0.8.3"
gix = "0.87.1"
sqlite-vec = "0.1.9"

[[bin]]
name = "prune"
path = "src/main.rs"

[lib]
name = "prune_core"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3.14"

[profile.release]
lto = true
codegen-units = 1
strip = true
